<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gemini Enterprise for teams building with Claude</title>
<meta name="description" content="Keep Claude Code. Add Gemini. A pooled Gemini quota your developers can delegate to, and chat for everyone that sits outside the quota.">
<link rel="icon" href="data:,">
<style>
  :root {
    --navy: #0B1F3A;
    --blue: #1A62D6;
    --amber: #F9AB00;
    --grey: #F5F7FA;
    --white: #FFFFFF;
    --ink: #0B1F3A;
    --body: #36455C;
    --muted: #55647A;
    --line: #DDE3EC;
    --amber-tint: #FFF4D6;
    --on-navy: #FFFFFF;
    --on-navy-soft: #C9D5E8;
    --chart-pay: #1A62D6;
    --chart-quota: #7BA7EC;
    --maxw: 1120px;
    --gutter: 24px;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.55;
    color: var(--body);
    background: var(--white);
    overflow-wrap: break-word;
  }
  h1, h2, h3, p, ul, ol, dl, dd, figure, table { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  a { color: var(--blue); }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  .skip {
    position: absolute; left: 12px; top: -80px; z-index: 100;
    background: var(--white); color: var(--navy); padding: 10px 14px; border-radius: 6px;
    font-weight: 600; text-decoration: none; border: 2px solid var(--blue);
  }
  .skip:focus { top: 12px; }

  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
  .on-navy :focus-visible { outline-color: var(--amber); }

  .wrap { width: 100%; max-width: calc(var(--maxw) + 2 * var(--gutter)); margin: 0 auto; padding: 0 var(--gutter); }
  section { scroll-margin-top: 84px; }
  .section { padding: 96px 0; }
  .section.grey { background: var(--grey); }
  .on-navy { background: var(--navy); color: var(--on-navy-soft); }

  .eyebrow {
    font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--blue); margin-bottom: 14px;
  }
  .on-navy .eyebrow { color: var(--amber); }
  h1, h2, h3 { color: var(--ink); letter-spacing: -0.02em; text-wrap: balance; }
  .on-navy h1, .on-navy h2, .on-navy h3 { color: var(--on-navy); }
  h1 { font-size: clamp(2.1rem, 5.4vw, 4rem); line-height: 1.04; font-weight: 750; letter-spacing: -0.03em; }
  h2 { font-size: clamp(1.75rem, 3.6vw, 2.75rem); line-height: 1.1; font-weight: 720; max-width: 22ch; }
  h3 { font-size: 1.15rem; line-height: 1.3; font-weight: 680; letter-spacing: -0.01em; }
  .lede { font-size: 1.15rem; max-width: 62ch; }
  .section-head { margin-bottom: 48px; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; text-align: center;
    min-height: 46px; padding: 11px 20px; border-radius: 8px; border: 2px solid transparent;
    font-weight: 650; font-size: 1rem; line-height: 1.2; text-decoration: none; cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-primary { background: var(--blue); color: var(--white); border-color: var(--blue); }
  .btn-primary:hover { background: #154FB0; border-color: #154FB0; }
  .btn-ghost { background: transparent; color: var(--white); border-color: rgba(255,255,255,.55); }
  .btn-ghost:hover { border-color: var(--white); background: rgba(255,255,255,.08); }

  /* Review bar */
  .review-bar { background: var(--amber-tint); color: var(--navy); font-size: 14px; border-bottom: 1px solid #F0DCA0; }
  .review-bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 7px; padding-bottom: 7px; }
  .review-bar p { font-weight: 600; }
  .review-bar button {
    background: transparent; border: 1px solid rgba(11,31,58,.45); border-radius: 6px;
    padding: 3px 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--navy); flex: none;
  }
  .review-bar button:hover { background: rgba(11,31,58,.08); }

  /* Header */
  .site-header { position: sticky; top: 0; z-index: 50; background: var(--white); border-bottom: 1px solid var(--line); }
  .site-header .wrap { display: flex; align-items: center; gap: 24px; min-height: 64px; }
  .wordmark { font-weight: 700; color: var(--navy); font-size: 16px; letter-spacing: -0.01em; text-decoration: none; white-space: nowrap; }
  .wordmark .sep { color: var(--muted); font-weight: 400; margin: 0 8px; }
  .wordmark .second { font-weight: 500; }
  .site-nav { display: flex; align-items: center; gap: 28px; margin-left: auto; }
  .site-nav ul { display: flex; gap: 26px; }
  .site-nav a.link { color: var(--body); text-decoration: none; font-size: 15px; font-weight: 550; padding: 6px 0; }
  .site-nav a.link:hover { color: var(--blue); }
  .site-nav .btn { min-height: 40px; padding: 8px 16px; font-size: 15px; }
  .menu-toggle {
    display: none; margin-left: auto; background: var(--white); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-weight: 650; font-size: 15px; color: var(--navy); cursor: pointer;
  }

  /* Hero */
  .hero { padding: 104px 0 88px; }
  .hero h1 { max-width: 17ch; }
  .hero .lede { margin-top: 26px; color: var(--on-navy-soft); font-size: clamp(1.05rem, 1.6vw, 1.3rem); max-width: 58ch; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 36px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 72px; border-top: 1px solid rgba(255,255,255,.18); }
  .stat { padding: 26px 28px 0 0; }
  .stat + .stat { padding-left: 28px; border-left: 1px solid rgba(255,255,255,.18); }
  .stat-value { display: block; font-size: clamp(2.2rem, 4.4vw, 3.4rem); font-weight: 750; letter-spacing: -0.03em; line-height: 1; color: var(--white); font-variant-numeric: tabular-nums; }
  .stat:first-child .stat-value { color: var(--amber); }
  .stat-label { display: block; margin-top: 10px; color: var(--on-navy-soft); font-size: 1rem; max-width: 24ch; }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: var(--grey); border-radius: var(--radius); padding: 28px; }
  .card h3 { margin-bottom: 10px; }
  .closing { margin-top: 40px; font-size: 1.25rem; font-weight: 600; color: var(--ink); max-width: 46ch; letter-spacing: -0.01em; }

  /* Steps diagram */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; }
  .step { position: relative; background: var(--white); border: 1px solid var(--line); border-top: 4px solid var(--navy); border-radius: var(--radius); padding: 24px 24px 28px; }
  .step:nth-child(2) { border-top-color: var(--blue); }
  .step:nth-child(3) { border-top-color: var(--amber); }
  .step-label { display: block; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .step p { color: var(--ink); font-size: 1.08rem; font-weight: 560; line-height: 1.4; }
  .step:not(:last-child)::before {
    content: ""; position: absolute; top: 50%; right: -37px; width: 26px; height: 2px; background: var(--muted);
  }
  .step:not(:last-child)::after {
    content: ""; position: absolute; top: 50%; right: -37px; width: 10px; height: 10px;
    border-top: 2px solid var(--muted); border-right: 2px solid var(--muted); transform: translateY(-4px) rotate(45deg);
  }
  .note { margin-top: 28px; font-size: 15px; color: var(--muted); max-width: 70ch; }

  /* Offer */
  .offer-grid { display: grid; grid-template-columns: 5fr 7fr; gap: 56px; align-items: start; }
  .checklist-title { font-size: 1rem; font-weight: 700; color: var(--ink); margin-bottom: 16px; }
  .checklist li { position: relative; padding: 14px 0 14px 34px; border-top: 1px solid var(--line); color: var(--ink); }
  .checklist li:last-child { border-bottom: 1px solid var(--line); }
  .checklist li::before {
    content: ""; position: absolute; left: 4px; top: 19px; width: 14px; height: 8px;
    border-left: 3px solid var(--blue); border-bottom: 3px solid var(--blue); transform: rotate(-45deg);
  }
  .tag { display: inline-block; font-size: 13px; font-weight: 650; color: var(--navy); background: var(--grey); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; margin-bottom: 14px; }
  .table-scroll { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 14px 16px; text-align: right; border-bottom: 1px solid var(--line); font-size: 15px; }
  th[scope="row"], thead th:first-child { text-align: left; }
  thead th { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; background: var(--grey); }
  tbody th { font-weight: 560; color: var(--ink); }
  tbody td { color: var(--ink); }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
  tr.highlight th, tr.highlight td { background: var(--amber-tint); font-weight: 750; font-size: 16px; }
  tr.highlight th { box-shadow: inset 4px 0 0 var(--amber); }
  .caption { margin-top: 14px; font-size: 15px; color: var(--muted); }
  .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }

  /* Calculator */
  .calc { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 36px; box-shadow: 0 1px 2px rgba(11,31,58,.04), 0 12px 32px rgba(11,31,58,.06); }
  .calc-top { display: grid; grid-template-columns: 4fr 8fr; gap: 48px; align-items: start; }
  .field label { display: block; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
  .money { display: flex; align-items: center; max-width: 280px; border: 2px solid #8A97AB; border-radius: 8px; background: var(--white); }
  .money:focus-within { border-color: var(--blue); outline: 3px solid var(--blue); outline-offset: 3px; }
  .money-sign { padding-left: 14px; font-size: 1.6rem; font-weight: 700; color: var(--muted); }
  .money input {
    flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; border-radius: 8px;
    font-size: 1.6rem; font-weight: 700; color: var(--ink); padding: 10px 14px 10px 4px; font-variant-numeric: tabular-nums;
  }
  .money input:focus-visible { outline: none; }
  .basis { margin-top: 14px; font-size: 14px; color: var(--muted); }
  .field input[type="range"] { width: 100%; margin: 22px 0 6px; accent-color: var(--blue); height: 28px; cursor: pointer; }
  .range-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hint { min-height: 1.5em; margin-top: 10px; font-size: 14px; color: #8A4B00; font-weight: 600; }
  .outputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .out { padding: 20px 22px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .out-label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); }
  .out-value { display: block; margin-top: 6px; white-space: nowrap; font-size: clamp(1.7rem, 3vw, 2.4rem); font-weight: 750; letter-spacing: -0.03em; line-height: 1.05; color: var(--ink); font-variant-numeric: tabular-nums; }
  .out.primary .out-value { color: var(--blue); }

  .chart-block { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line); }
  .chart-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 24px; margin-bottom: 20px; }
  .chart-title { font-size: 1rem; font-weight: 700; color: var(--ink); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--body); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .swatch.pay { background: var(--chart-pay); }
  .swatch.quota { background: var(--chart-quota); }
  .chart { display: grid; gap: 16px; }
  .chart-row { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 12px; padding: 4px 0; border-radius: 6px; }
  .chart-row:hover { background: var(--grey); }
  .chart-q { font-size: 14px; font-weight: 700; color: var(--ink); }
  .bars { display: grid; gap: 2px; min-width: 0; }
  .bar-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bar { flex: none; height: 14px; min-width: 2px; border-radius: 0 4px 4px 0; width: calc((100% - 92px) * var(--f, 0)); transition: width .25s ease; }
  .bar.pay { background: var(--chart-pay); }
  .bar.quota { background: var(--chart-quota); }
  .bar-val { font-size: 13px; color: var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-line.pay .bar-val { font-weight: 700; color: var(--ink); }
  .data-table { margin-top: 20px; }
  .data-table summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--blue); width: fit-content; padding: 4px 0; }
  .data-table .table-scroll { margin-top: 12px; }

  /* Comparison */
  .compare th, .compare td { text-align: left; vertical-align: top; }
  .compare thead th { text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); }
  .compare td { font-size: 1.05rem; font-weight: 650; }
  .compare .sub { font-weight: 400; }
  .compare-wrap { max-width: 860px; }
  .compare-note { margin-top: 28px; max-width: 64ch; font-size: 1.1rem; color: var(--ink); }

  /* Timeline */
  .timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; counter-reset: none; }
  .timeline li { position: relative; padding-top: 30px; border-top: 2px solid var(--line); }
  .timeline li::before { content: ""; position: absolute; top: -8px; left: 0; width: 14px; height: 14px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px var(--white); }
  .timeline .when { display: block; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: 8px; }
  .timeline p { color: var(--ink); font-size: 1.08rem; font-weight: 560; line-height: 1.4; max-width: 30ch; }

  /* FAQ */
  .faq { max-width: 820px; border-top: 1px solid var(--line); }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 20px 4px; font-size: 1.1rem; font-weight: 650; color: var(--ink); letter-spacing: -0.01em;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after {
    content: ""; flex: none; width: 12px; height: 12px; margin-right: 4px;
    border-right: 2px solid var(--blue); border-bottom: 2px solid var(--blue); transform: translateY(-3px) rotate(45deg); transition: transform .2s ease;
  }
  .faq details[open] summary::after { transform: translateY(3px) rotate(-135deg); }
  .faq summary:hover { color: var(--blue); }
  .faq .answer { padding: 0 4px 22px; max-width: 64ch; }

  /* Contact and footer */
  .contact { padding: 96px 0; }
  .contact h2 { max-width: 20ch; }
  .contact-card { margin-top: 36px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px 40px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.18); }
  .contact-name { color: var(--white); font-size: 1.3rem; font-weight: 700; }
  .contact-title, .contact-email { color: var(--on-navy-soft); }
  .site-footer { padding: 32px 0 44px; border-top: 1px solid rgba(255,255,255,.14); font-size: 13px; }
  .site-footer .wordmark { color: var(--white); font-size: 14px; }
  .site-footer .wordmark .sep { color: var(--on-navy-soft); }
  .site-footer p { margin-top: 12px; max-width: 90ch; color: var(--on-navy-soft); }

  .noscript { padding: 48px 24px; text-align: center; color: var(--ink); }

  /* Why now: four cards */
  .cards.four { grid-template-columns: repeat(2, 1fr); }

  /* How it works: four-node flow, sign-in steps, terminal */
  .steps.four { grid-template-columns: repeat(4, 1fr); gap: 40px; }
  .steps.four .step { padding: 22px 20px 24px; }
  .steps.four .step:nth-child(3) { border-top-color: var(--chart-quota); }
  .steps.four .step:nth-child(4) { border-top-color: var(--amber); }
  .steps.four .step h3 { margin-bottom: 8px; }
  .steps.four .step p { font-size: 1rem; font-weight: 400; color: var(--body); line-height: 1.5; }
  .steps.four .step:not(:last-child)::before { right: -32px; width: 22px; }
  .steps.four .step:not(:last-child)::after { right: -32px; }
  .how-detail { display: grid; grid-template-columns: 5fr 7fr; gap: 48px; margin-top: 56px; align-items: start; }
  .how-detail > * { min-width: 0; }
  .how-detail h3 { margin-bottom: 16px; }
  .signin { counter-reset: signin; display: grid; gap: 10px; }
  .signin li {
    counter-increment: signin; display: flex; gap: 12px; align-items: center; color: var(--ink); font-weight: 560;
    background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
  }
  .signin li::before {
    content: counter(signin); flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: var(--white);
    font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .terminal {
    background: var(--navy); border-radius: 12px; overflow: hidden; color: #D7E1F0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; line-height: 1.6;
  }
  .terminal-bar { display: flex; gap: 6px; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.12); }
  .terminal-bar i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.28); }
  .terminal-body { padding: 16px 18px 20px; display: grid; gap: 8px; overflow-wrap: anywhere; }
  .t-line { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
  .t-line .who { color: #9FB3D1; font-family: var(--font); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding-top: 3px; }
  .t-shell .txt, .t-user .txt { color: var(--white); font-weight: 600; }
  .t-tool .txt { color: var(--amber); }
  .t-result .txt { color: #9FB3D1; font-style: italic; }
  .t-gap { height: 1px; margin: 8px 0; background: rgba(255,255,255,.12); }

  /* What to delegate */
  .task-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .task-col { background: var(--grey); border-radius: var(--radius); padding: 28px; border-top: 4px solid var(--blue); min-width: 0; }
  .task-col.task-1 { border-top-color: var(--navy); }
  .task-col.task-2 { border-top-color: var(--chart-quota); }
  .task-tag { font-size: 14px; color: var(--muted); margin: 6px 0 4px; }
  .task-col ul { display: grid; }
  .task-col li { display: grid; gap: 2px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .task-col li:last-child { border-bottom: 0; padding-bottom: 0; }
  .task-col li strong { color: var(--ink); font-weight: 650; }
  .task-col li span { font-size: 15px; color: var(--body); }

  /* Pooled quota */
  .pool-lede { margin-top: 18px; }
  .pool-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .panel { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: 28px; min-width: 0; }
  .panel h3 { margin-bottom: 6px; }
  .panel > p, .avg-head p { font-size: 15px; }
  .lanes { display: grid; gap: 12px; margin: 22px 0 16px; }
  .lane-row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
  .lane { position: relative; height: 16px; }
  .lane-allow, .lane-used { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
  .lane-allow { background: #E3E9F1; }
  .lane-used { background: var(--chart-pay); }
  .lane-denied { position: absolute; top: 0; bottom: 0; border: 2px dashed #A86400; border-left: 0; border-radius: 0 4px 4px 0; background: var(--amber-tint); }
  .lane-cap { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
  .pool-bar { display: flex; gap: 2px; height: 44px; background: #E3E9F1; border-radius: 6px; overflow: hidden; margin: 22px 0 16px; }
  .pool-seg { background: var(--chart-pay); height: 100%; }
  .key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--body); }
  .key span { display: inline-flex; gap: 6px; align-items: center; }
  .key i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .key .k-used { background: var(--chart-pay); }
  .key .k-unused { background: #E3E9F1; }

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const num = (v, fallback) => (typeof v === "number" && Number.isFinite(v) ? v : fallback);
const tidy = (n) => { const r = Math.round(n * 100) / 100; return r === 0 ? 0 : r; };
const cap = (s) => String(s).charAt(0).toUpperCase() + String(s).slice(1);

const fmtUsd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 0, maximumFractionDigits: 0 });
const fmtUsd2 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtInt = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const fmtDate = new Intl.DateTimeFormat("en-US", { year: "numeric", month: "long", day: "numeric" });

const usdTotal = (n) => fmtUsd0.format(tidy(Math.round(n)));          // totals: no decimals
const usdPerUser = (n) => fmtUsd2.format(tidy(n));                    // per-user: two decimals
const usdShort = (n) => { const t = tidy(n); return Number.isInteger(t) ? fmtUsd0.format(t) : fmtUsd2.format(t); }; // in sentences
const pct = (fraction) => { const v = Math.round(fraction * 1000) / 10; return (Number.isInteger(v) ? String(v) : v.toFixed(1)) + "%"; };
const times = (n) => { const r = Math.round(n * 10) / 10; return (Number.isInteger(r) ? String(r) : r.toFixed(1)) + "x"; };

function numberWords(n) {
  const ones = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve",
    "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
  const tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
  if (!Number.isInteger(n) || n < 0 || n > 99) return String(n);
  return n < 20 ? ones[n] : tens[Math.floor(n / 10)] + (n % 10 ? "-" + ones[n % 10] : "");
}
const ORDINALS = ["first", "second", "third", "fourth", "fifth", "sixth", "seventh", "eighth"];

function fill(str, tokens) {
  return String(str).replace(/\{(\w+)\}/g, (m, key) => (Object.prototype.hasOwnProperty.call(tokens, key) ? tokens[key] : m));
}
function lookup(obj, path) {
  return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    if (k === "text") node.textContent = attrs[k];
    else if (k === "class") node.className = attrs[k];
    else node.setAttribute(k, attrs[k]);
  }
  if (children) for (const c of [].concat(children)) if (c) node.appendChild(c);
  return node;
}

/* ------------------------------------------------------------------
   Calculation rules
------------------------------------------------------------------- */
const C = CONFIG.copy;
const LIST = Math.max(0, num(CONFIG.listPerUserMonth, 0));
const DISCOUNT = Math.min(100, Math.max(0, num(CONFIG.discountPct, 0)));
const QUOTA = Math.max(0, num(CONFIG.quotaPerUserMonth, 0));
const COVERAGE = (Array.isArray(CONFIG.creditCoverageByQuarter) ? CONFIG.creditCoverageByQuarter : [])
  .map((c) => Math.min(1, Math.max(0, num(c, 0))));
const MONTHS_Q = Math.max(1, num(CONFIG.monthsPerQuarter, 3));
const MONTHS_Y = Math.max(1, num(CONFIG.monthsPerYear, 12));
const MIN_SEATS = Math.max(1, Math.round(Math.min(num(CONFIG.minSeats, 1), num(CONFIG.maxSeats, 1))));
const MAX_SEATS = Math.max(MIN_SEATS, Math.round(Math.max(num(CONFIG.minSeats, 1), num(CONFIG.maxSeats, 1))));
const clampSeats = (n) => Math.min(MAX_SEATS, Math.max(MIN_SEATS, Math.round(n)));
const DEFAULT_SEATS = clampSeats(num(CONFIG.defaultSeats, MIN_SEATS));
const OVERAGE = Math.min(100, Math.max(0, num(CONFIG.overageDiscountPct, 0)));
const W = CONFIG.workload || {};
const pair = (o, a, b) => ({ min: num((o || {}).min, a), max: num((o || {}).max, b) });
const EXEC = pair(W.executionSharePct, 0, 0);
const FRONTIER = pair(W.frontierSavingPct, 0, 0);
const FLASH_RATE = Math.min(100, Math.max(1, num(W.flashPromoRatePct, 100)));
const FLASH_MULTIPLE = 100 / FLASH_RATE;

const NET = Math.max(0, num(CONFIG.netPerUserMonth, LIST * (1 - DISCOUNT / 100)));
const PAY = COVERAGE.map((c) => NET * (1 - c));        // payPerUserMonth by quarter
const SUM_PAY = PAY.reduce((a, b) => a + b, 0);
const FINAL_PAY = PAY.length ? PAY[PAY.length - 1] : NET;
const PER_SEAT_YEAR = tidy(MONTHS_Q * SUM_PAY);        // what one seat costs in year one
const SPEND_SIZED = PER_SEAT_YEAR > 0;                 // sizing by spend needs a non-zero seat cost
const MIN_SPEND = Math.max(PER_SEAT_YEAR, num(CONFIG.minSpendYear, MIN_SEATS * PER_SEAT_YEAR));   // the commitment floor
const MAX_SPEND = Math.max(MIN_SPEND, num(CONFIG.maxSpendYear, MAX_SEATS * PER_SEAT_YEAR));
const clampSpend = (n) => Math.min(MAX_SPEND, Math.max(MIN_SPEND, n));
const DEFAULT_SPEND = clampSpend(num(CONFIG.defaultSpendYear, MIN_SPEND));
const seatsForSpend = (spend) => (SPEND_SIZED ? Math.floor((spend + 0.005) / PER_SEAT_YEAR) : DEFAULT_SEATS);

/* Year one for a given commitment. Seats are whole seats at the year-one seat price. */
function yearOne(spend) {
  const seats = seatsForSpend(spend);
  const pay = spend;
  const quota = seats * MONTHS_Y * QUOTA;
  const list = seats * MONTHS_Y * LIST;
  const share = (p) => (SUM_PAY > 0 ? p / SUM_PAY : 0);     // how the year's spend falls across the quarters
  return {
    seats,
    pay, quota, list,
    multiple: pay > 0 ? quota / pay : null,
    saving: list > 0 ? 1 - pay / list : null,
    quarters: PAY.map((p) => ({ pay: spend * share(p), quota: seats * MONTHS_Q * QUOTA }))
  };
}

function priceRatio() {
  const g = CONFIG.geminiListPrice || {}, c = CONFIG.claudeListPrice || {};
  const rIn = num(g.input, 0) / (num(c.input, 0) || 1);
  const rOut = num(g.output, 0) / (num(c.output, 0) || 1);
  const isHalf = Math.abs(rIn - 0.5) < 0.005 && Math.abs(rOut - 0.5) < 0.005;
  const worst = Math.round(Math.max(rIn, rOut) * 100) + "%";
  return { of: isHalf ? "half" : worst + " of", asMuch: isHalf ? "half as much" : worst + " as much" };
}

const defaults = yearOne(DEFAULT_SPEND);

/* The larger of the input and output price ratios, so the claim is never flattered. */
const priceShare = (a, b) => Math.max(num((a || {}).input, 0) / (num((b || {}).input, 0) || 1), num((a || {}).output, 0) / (num((b || {}).output, 0) || 1));
const fmtScore = (value, unit) => (typeof value !== "number" || !Number.isFinite(value) ? null
  : unit === "pct" ? value.toFixed(1) + "%" : unit === "score1" ? value.toFixed(1) : fmtInt.format(value));
/* How much less a token costs on the featured Gemini model, at list: against Claude Opus 5.5 and against Claude Fable 5.2. */
const COST_LOWER = (() => {
  const gaps = [CONFIG.claudeOpusListPrice, CONFIG.claudeListPrice].map((p) => tidy((1 - priceShare(CONFIG.geminiListPrice, p)) * 100));
  return { min: Math.max(0, Math.min(...gaps)), max: Math.max(0, Math.max(...gaps)) };
})();
const ratio = priceRatio();

/* The payment schedule as runs of quarters at the same share of the full price. */
function payGroups() {
  const groups = [];
  PAY.forEach((p) => {
    const share = NET > 0 ? Math.round((p / NET) * 1000) / 1000 : 0;
    const last = groups[groups.length - 1];
    if (last && last.share === share) last.quarters += 1;
    else groups.push({ share, quarters: 1 });
  });
  return groups;
}
function payLabel(g, i, count) {
  const O = C.simple.offer;
  if (i === 0) return fill(O.payFirst, { months: String(g.quarters * MONTHS_Q) });
  if (i === count - 1) return g.quarters === 1 ? O.payLast : fill(O.payLastMany, { n: numberWords(g.quarters) });
  return g.quarters === 1 ? O.payNextOne : fill(O.payNext, { n: numberWords(g.quarters) });
}
const payValue = (g) => (g.share === 0 ? usdShort(0) : pct(g.share));
function paySentence() {
  const O = C.simple.offer;
  const parts = payGroups().map((g, i, all) =>
    (i === 0 ? (g.share === 0 ? O.payNothing : O.payFirstSome + " " + payValue(g)) : payValue(g)) + " " + payLabel(g, i, all.length));
  return parts.length > 1 ? parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] : parts.join("");
}

/* Per-person caps against one pool, drawn from the same six demands. */
function renderPoolConcept() {
  const P = C.pool;
  const demand = ((CONFIG.poolConcept || {}).demand || []).map((d) => Math.max(0, num(d, 0)));
  const people = demand.length;
  if (!people) return;
  const scale = Math.max(1, ...demand);
  const capAt = (1 / scale) * 100;
  const blocked = demand.filter((d) => d > 1).length;
  const unused = demand.reduce((a, d) => a + Math.max(0, 1 - d), 0);

    used.style.width = (Math.min(d, 1) / scale) * 100 + "%";

  const perStat = fill(P.perPersonStat, { blocked: fmtInt.format(blocked), people: fmtInt.format(people), unused: oneDp(unused) });

  const perKey = $("pool-per-person-key");

  const bar = $("pool-pooled");
  const poolScale = Math.max(people, total);
  demand.forEach((d) => {

/* Workload model: what knowledge workers draw, what is left for engineering, and spend before and after. */
function buildWorkload() {
  const P = C.pool;
  const R = W.ranges || {};
  const mover = $("s-offload");
  const rng = (o, a, b, c) => ({ min: num((o || {}).min, a), max: num((o || {}).max, b), step: num((o || {}).step, c) });
  const spendR = rng(R.claudeSpend, 0, 500, 10), kwR = rng(R.knowledgeDraw, 0, 40, 1);
  const defs = [
    { key: "dev", min: 0, max: calc.seats, step: 1, value: Math.min(calc.seats, num(W.developers, 0)) },
    { key: "spend", min: spendR.min, max: spendR.max, step: spendR.step, value: num(W.claudeSpendPerDevMonth, 0) },
    { key: "offload", min: 0, max: 100, step: 5, value: num(W.offloadPct, 0) },
    { key: "kw", min: kwR.min, max: kwR.max, step: kwR.step, value: num(W.knowledgeDrawPerUserMonth, 0) }
  ];
  const inputs = {}, lines = {};
  const box = $("wl-controls");
  defs.forEach((d) => {
    const input = el("input", { id: "wl-" + d.key, type: "range", min: String(d.min), max: String(d.max), step: String(d.step) });
    input.value = String(Math.min(d.max, Math.max(d.min, d.value)));
    const line = el("p", { class: "avg-line" });
    inputs[d.key] = input;
    lines[d.key] = line;
    box.appendChild(el("div", { class: "field" }, [el("label", { for: "wl-" + d.key, text: P.controls[d.key] }), line, input]));
    input.addEventListener("input", update);
  });

  const swatch = (cls, text) => el("span", null, [el("i", { class: "swatch " + cls, "aria-hidden": "true" }), document.createTextNode(text)]);
  const poolBar = $("wl-pool-bar"), segs = {};
  ["kw", "low", "extra"].forEach((k) => { segs[k] = el("span", { class: "avg-seg " + k }); poolBar.appendChild(segs[k]); });
  const marker = el("span", { class: "avg-marker" }, el("span", { class: "avg-marker-label", text: P.poolMarker }));
  poolBar.appendChild(marker);
  const poolLegend = $("wl-pool-legend");
  ["kw", "low", "extra"].forEach((k) => poolLegend.appendChild(swatch(k, P.poolLegend[k])));

  const tiles = {};
  const outputs = $("wl-outputs");
  ["pool", "kw", "room", "moved", "need", "fit"].forEach((k) => {
    const value = el("span", { class: "out-value" }), sub = el("span", { class: "out-sub" });
    tiles[k] = { value, sub };
    outputs.appendChild(el("div", { class: "out" + (k === "room" ? " primary" : "") }, [el("span", { class: "out-label", text: P.outputs[k] }), value, sub]));
  });

  const spend = $("wl-spend-chart"), rows = {};
  [["before", ["claude"]], ["after", ["claude", "seats", "payg"]]].forEach(([k, parts]) => {
    const stack = el("span", { class: "wl-stack" }), value = el("span", { class: "bar-val" }), seg = {};
    parts.forEach((p) => { seg[p] = el("span", { class: "wl-seg " + p }); stack.appendChild(seg[p]); });
    rows[k] = { stack, value, seg };
    spend.appendChild(el("div", { class: "wl-row" }, [el("span", { class: "wl-name", text: P.spendRows[k] }), el("div", { class: "wl-track" }, [stack, value])]));
  });
  const spendLegend = $("wl-spend-legend");
  ["claude", "seats", "payg"].forEach((k) => spendLegend.appendChild(swatch("wl-" + k, P.spendLegend[k])));

  const range = (a, b) => (Math.round(a) === Math.round(b) ? usdTotal(a) : fill(P.rangeText, { a: usdTotal(Math.min(a, b)), b: usdTotal(Math.max(a, b)) }));

  let lastSeats = 0;
  function update() {
    const seats = calc.seats;
    if (lastSeats > 0 && seats !== lastSeats) {            // the team grows or shrinks with the commitment
      const scaled = Math.round(((Number(inputs.dev.value) || 0) * seats) / lastSeats);
      inputs.dev.max = String(Math.max(seats, scaled));
      inputs.dev.value = String(scaled);
    }
    lastSeats = seats;
    inputs.dev.max = String(seats);
    const devs = Math.min(seats, Math.max(0, Math.round(Number(inputs.dev.value) || 0))), kws = Math.max(0, seats - devs);
    const spendDev = Number(inputs.spend.value) || 0, offload = Number(inputs.offload.value) || 0, kwDraw = Number(inputs.kw.value) || 0;

    const pool = seats * QUOTA;
    const kwTotal = kws * kwDraw;
    const room = Math.max(0, pool - kwTotal);
    const before = devs * spendDev;
    const moved = (before * offload) / 100;
    const stays = before - moved;
    const needLow = moved * (1 - COST_LOWER.max / 100), needHigh = moved * (1 - COST_LOWER.min / 100);
    const overLow = Math.max(0, kwTotal + needLow - pool), overHigh = Math.max(0, kwTotal + needHigh - pool);
    const payg = (over) => over * (1 - OVERAGE / 100);
    const seatCost = calc.spend / MONTHS_Y;
    const after = stays + seatCost + payg(overHigh);

    lines.dev.textContent = fill(P.lines.dev, { devs: fmtInt.format(devs), kws: fmtInt.format(kws) });
    lines.spend.textContent = fill(P.lines.spend, { amount: usdShort(spendDev) });
    lines.offload.textContent = fill(P.lines.offload, { share: offload + "%" });
    lines.kw.textContent = fill(P.lines.kw, { amount: usdShort(kwDraw) });
    Object.keys(inputs).forEach((k) => inputs[k].setAttribute("aria-valuetext", lines[k].textContent));

    const scale = Math.max(pool, kwTotal + needHigh, 1);
    segs.kw.style.width = (kwTotal / scale) * 100 + "%";
    segs.low.style.width = (needLow / scale) * 100 + "%";
    segs.extra.style.width = ((needHigh - needLow) / scale) * 100 + "%";
    marker.style.left = (pool / scale) * 100 + "%";
    poolBar.setAttribute("aria-label", fill(P.poolBarAlt, { pool: usdTotal(pool), kw: usdTotal(kwTotal), need: range(needLow, needHigh) }));

    tiles.pool.value.textContent = usdTotal(pool);
    tiles.kw.value.textContent = usdTotal(kwTotal);
    tiles.room.value.textContent = usdTotal(room);
    tiles.room.sub.textContent = t(P.roomSub, { flash: usdTotal(room * FLASH_MULTIPLE) });
    tiles.moved.value.textContent = usdTotal(moved);
    tiles.moved.sub.textContent = P.movedSub;
    tiles.need.value.textContent = range(needLow, needHigh);
    tiles.need.sub.textContent = t(P.needSub);
    if (overHigh <= 0) {
      tiles.fit.value.textContent = P.fit.yes;
      tiles.fit.sub.textContent = fill(P.fit.yesSub, { range: range(pool - kwTotal - needHigh, pool - kwTotal - needLow) });
    } else if (overLow <= 0) {
      tiles.fit.value.textContent = P.fit.partly;
      tiles.fit.sub.textContent = t(P.fit.partlySub, { over: usdTotal(overHigh), cost: usdTotal(payg(overHigh)) });
    } else {
      tiles.fit.value.textContent = P.fit.no;
      tiles.fit.sub.textContent = t(P.fit.noSub, { range: range(overLow, overHigh), cost: range(payg(overLow), payg(overHigh)) });
    }

    const spendScale = Math.max(before, after, 1);
    const draw = (row, total, parts) => {
      row.stack.style.setProperty("--f", String(total / spendScale));
      Object.keys(row.seg).forEach((k) => { row.seg[k].style.flexGrow = String(Math.max(0, parts[k] || 0)); row.seg[k].hidden = !(parts[k] > 0); });
      row.value.textContent = usdTotal(total);
    };
    draw(rows.before, before, { claude: before });
    draw(rows.after, after, { claude: stays, seats: seatCost, payg: payg(overHigh) });
    spend.setAttribute("aria-label", fill(P.spendAlt, {
      before: usdTotal(before), stays: usdTotal(stays), seatCost: usdTotal(seatCost), payg: usdTotal(payg(overHigh)), after: usdTotal(after)
    }));
    $("wl-summary").textContent = before > 0
      ? fill(P.summary, { before: usdTotal(before), after: usdTotal(after),
          delta: fill(after <= before ? P.deltaLower : P.deltaHigher, { pct: pct(Math.abs(1 - after / before)) }) })
      : P.summaryNoSpend;
    const delta = before > 0 ? fill(after <= before ? P.deltaLower : P.deltaHigher, { pct: pct(Math.abs(1 - after / before)) }) : "";
    $("econ-headline").textContent = before > 0 ? fill(C.econ.headline, { before: usdTotal(before), after: usdTotal(after) }) : C.econ.headlineNoSpend;
    $("econ-sub").textContent = before > 0 ? fill(C.econ.sub, { delta: cap(delta) }) : P.summaryNoSpend;
    mover.value = String(offload);
    if (simpleCompare) simpleCompare({ devs, kws, spendDev, before, stays, seatCost, payg: payg(overHigh), after, offload });
    $("wl-caption").textContent = t(P.workloadCaption, { seats: fmtInt.format(seats) }) + " " + C.disclaimer;
  }
  // The main page's slider drives the same model.
  mover.min = "0"; mover.max = "100"; mover.step = inputs.offload.step;
  mover.addEventListener("input", () => { inputs.offload.value = mover.value; update(); });
  calc.listeners.push(update);
  update();
}

/* Main-page before-and-after, in year-one totals: cards, band and table, redrawn by the workload model. */
let simpleCompare = null;
function buildSimpleCompare() {
  const X = C.simple.compare, T = X.table;
  const table = $("s-table");
  table.appendChild(el("thead", null, el("tr", null, T.head.map((h, i) =>
    el("th", { scope: "col" }, i === 0 ? el("span", { class: "sr-only", text: h }) : document.createTextNode(h))))));
  const body = el("tbody"), cells = {};
  ["claude", "gemini", "payg", "total", "work", "people", "limits"].forEach((k) => {
    cells[k] = { before: el("td"), after: el("td"), change: el("td") };
    body.appendChild(el("tr", k === "total" ? { class: "highlight" } : null,
      [el("th", { scope: "row", text: T.rows[k] }), cells[k].before, cells[k].after, cells[k].change]));
  });
  table.appendChild(body);
  cells.limits.before.textContent = T.limitsBefore;
  cells.limits.after.textContent = T.limitsAfter;
  cells.work.before.textContent = T.workBefore;
  cells.work.change.textContent = T.workChange;

  const legend = $("s-split-legend");
  [["exec", X.splitLegend.gemini], ["plan", X.splitLegend.claude]].forEach(([cls, text]) =>
    legend.appendChild(el("span", null, [el("i", { class: "swatch " + cls, "aria-hidden": "true" }), document.createTextNode(text)])));

  const change = (n) => { const r = Math.round(n); return r === 0 ? T.noChange : (r < 0 ? "\u2212" : "+") + usdTotal(Math.abs(r)); };
  const row = (k, before, after) => {
    cells[k].before.textContent = usdTotal(before);
    cells[k].after.textContent = usdTotal(after);
    cells[k].change.textContent = change(after - before);
  };

  simpleCompare = (m) => {
    const Y = MONTHS_Y;                                   // every figure below is a year-one total unless it says a month
    const diff = m.before - m.after, flat = Math.round(diff) === 0 || m.before <= 0;
    const share = { gemini: m.offload + "%", claude: (100 - m.offload) + "%" };
    const readout = fill(X.readout, share);
    const people = { devs: fmtInt.format(m.devs), kws: fmtInt.format(m.kws) };
    $("s-cmp-heading").textContent = m.before > 0 ? fill(X.heading, { devs: people.devs, before: usdTotal(m.before * Y) }) : X.headingNoSpend;
    $("s-offload-readout").textContent = readout;
    $("s-seg-gemini").style.width = m.offload + "%";
    $("s-seg-claude").style.width = (100 - m.offload) + "%";
    $("s-before").textContent = usdTotal(m.before * Y);
    $("s-before-line").textContent = fill(X.left.line, { devs: people.devs, spendDev: usdShort(m.spendDev), month: usdTotal(m.before) });
    $("s-after").textContent = usdTotal(m.after * Y);
    $("s-after-line").textContent = fill(m.payg > 0.5 ? X.right.linePayg : X.right.line,
      { stays: usdTotal(m.stays * Y), seatCost: usdTotal(m.seatCost * Y), payg: usdTotal(m.payg * Y), month: usdTotal(m.after) });
    const pctShare = m.before > 0 ? pct(Math.abs(diff) / m.before) : "";
    $("s-chip").textContent = flat ? X.right.chipSame : fill(diff > 0 ? X.right.chipLower : X.right.chipHigher, { pct: pctShare });
    const band = $("s-band");
    band.textContent = flat ? X.right.chipSame
      : fill(diff > 0 ? X.bandLess : X.bandMore, { month: usdTotal(Math.abs(diff)), year: usdTotal(Math.abs(diff) * Y) });
    band.classList.toggle("more", !flat && diff < 0);
    row("claude", m.before * Y, m.stays * Y);
    row("gemini", 0, m.seatCost * Y);
    row("payg", 0, m.payg * Y);
    row("total", m.before * Y, m.after * Y);
    cells.work.after.textContent = fill(T.workAfter, share);
    cells.people.before.textContent = fill(T.peopleBefore, people);
    cells.people.after.textContent = fill(T.peopleAfter, people);
    $("s-offload").setAttribute("aria-valuetext", fill(X.valueText, { readout, after: usdTotal(m.after * Y), before: usdTotal(m.before * Y) }));
  };
}

/* ------------------------------------------------------------------
   Calculator: sized by year-one minimum spend, in whole seats
------------------------------------------------------------------- */
const calc = { spend: DEFAULT_SPEND, seats: seatsForSpend(DEFAULT_SPEND), timer: null, nodes: {}, listeners: [] };
const setSpend = (n) => { calc.spend = clampSpend(n); calc.seats = seatsForSpend(calc.spend); };

function buildCalculator() {
  const field = $("spend-number"), range = $("spend-range-input");
  const step = Math.max(1, num(CONFIG.spendStepYear, PER_SEAT_YEAR));
  range.min = String(MIN_SPEND);
  range.max = String(MAX_SPEND);
  range.step = String(step);
  $("range-min").textContent = usdTotal(MIN_SPEND);
  $("range-max").textContent = usdTotal(MAX_SPEND);
  if (!SPEND_SIZED) { field.disabled = true; range.disabled = true; }

  const outputs = $("calc-outputs");
  [["seats"], ["quota", true], ["multiple"], ["saving"]].forEach(([key, primary]) => {
    const value = el("span", { class: "out-value" });
    calc.nodes[key] = value;
    outputs.appendChild(el("div", { class: "out" + (primary ? " primary" : "") },
      [el("span", { class: "out-label", text: C.calculator.outputs[key] }), value]));
  });

  const legend = $("chart-legend");
  legend.appendChild(el("span", null, [el("i", { class: "swatch pay", "aria-hidden": "true" }), document.createTextNode(C.calculator.legendPay)]));
  legend.appendChild(el("span", null, [el("i", { class: "swatch quota", "aria-hidden": "true" }), document.createTextNode(C.calculator.legendQuota)]));

  const chart = $("chart");
  calc.nodes.rows = PAY.map((_, i) => {
    const payBar = el("span", { class: "bar pay" }), payVal = el("span", { class: "bar-val" });
    const quotaBar = el("span", { class: "bar quota" }), quotaVal = el("span", { class: "bar-val" });
    const row = el("div", { class: "chart-row" }, [
      el("span", { class: "chart-q", text: quarterName(i) }),
      el("div", { class: "bars" }, [
        el("div", { class: "bar-line pay" }, [payBar, payVal]),
        el("div", { class: "bar-line quota" }, [quotaBar, quotaVal])
      ])
    ]);
    chart.appendChild(row);
    return { row, payBar, payVal, quotaBar, quotaVal };
  });

  const table = $("chart-table");
  table.appendChild(el("thead", null, el("tr", null, [
    el("th", { scope: "col", text: C.calculator.tableQuarter }),
    el("th", { scope: "col", text: C.calculator.legendPay }),
    el("th", { scope: "col", text: C.calculator.legendQuota })
  ])));
  const body = el("tbody");
  calc.nodes.tableRows = PAY.map((_, i) => {
    const pay = el("td"), quota = el("td");
    body.appendChild(el("tr", null, [el("th", { scope: "row", text: quarterName(i) }), pay, quota]));
    return { pay, quota };
  });
  table.appendChild(body);

  const parse = (raw) => {
    const s = String(raw == null ? "" : raw).replace(/[$,\s]/g, "");
    if (s === "") return null;
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  };
  const stateTokens = () => ({ spend: usdTotal(calc.spend), seats: fmtInt.format(calc.seats) });
  const setHint = (template) => { $("spend-hint").textContent = template ? t(template, stateTokens()) : ""; };

  field.addEventListener("input", () => {
    const n = parse(field.value);
    if (n === null) { setHint(C.calculator.hintEmpty); return; }   // keep the last valid result on screen
    setSpend(n);
    range.value = String(calc.spend);
    updateCalculator();
    setHint(n < MIN_SPEND - 0.005 || n > MAX_SPEND + 0.005 ? C.calculator.hintClamped : "");
  });
  const settle = () => { field.value = fmtInt.format(calc.spend); };
  field.addEventListener("change", settle);
  field.addEventListener("blur", () => { settle(); setHint(""); });
  range.addEventListener("input", () => {
    const n = parse(range.value);
    setSpend(n === null ? calc.spend : n);
    settle();
    setHint("");
    updateCalculator();
  });

  settle();
  range.value = String(calc.spend);
  updateCalculator(true);
}

/* Everything the calculator, the email and the proposal say about the current sizing. */
function sizing() {
  const r = yearOne(calc.spend);
  return {
    r,
    seats: fmtInt.format(r.seats),
    seatsUpTo: fill(C.calculator.seatsValue, { seats: fmtInt.format(r.seats) }),
    spend: usdTotal(r.pay),
    month: usdTotal(r.pay / MONTHS_Y),
    quotaTotal: usdTotal(r.quota),
    multiple: r.multiple == null ? na : times(r.multiple),
    saving: r.saving == null ? na : pct(r.saving),
    quarters: r.quarters.map((q, i) => ({ name: quarterName(i), pay: usdTotal(q.pay), quota: usdTotal(q.quota), rawPay: q.pay, rawQuota: q.quota }))
  };
}

function updateCalculator(silent) {
  const s = sizing();
  calc.nodes.seats.textContent = s.seatsUpTo;
  $("spend-basis").textContent = t(C.calculator.basis, { month: s.month });
  calc.nodes.quota.textContent = s.quotaTotal;
  calc.nodes.multiple.textContent = s.multiple;
  calc.nodes.saving.textContent = s.saving;

  $("spend-range-input").setAttribute("aria-valuetext", fill(C.calculator.spendValueText, { spend: s.spend, seats: s.seats }));

  const scale = Math.max(1, ...s.quarters.map((q) => Math.max(q.rawPay, q.rawQuota)));
  const alt = [fill(C.calculator.chartAltIntro, { seats: s.seats })];
  s.quarters.forEach((q, i) => {
    const n = calc.nodes.rows[i];
    n.payBar.style.setProperty("--f", String(Math.min(1, q.rawPay / scale)));
    n.quotaBar.style.setProperty("--f", String(Math.min(1, q.rawQuota / scale)));
    n.payVal.textContent = q.pay;
    n.quotaVal.textContent = q.quota;
    const line = fill(C.calculator.chartAltRow, { quarter: q.name, pay: q.pay, quota: q.quota });
    n.row.setAttribute("title", line);
    calc.nodes.tableRows[i].pay.textContent = q.pay;
    calc.nodes.tableRows[i].quota.textContent = q.quota;
    alt.push(line);
  });
  $("chart").setAttribute("aria-label", alt.join(" "));
  calc.listeners.forEach((fn) => fn());

  if (silent) return;
  clearTimeout(calc.timer);
  calc.timer = setTimeout(() => {
    $("calc-status").textContent = fill(C.calculator.status, s);
  }, 500);
}

/* ------------------------------------------------------------------

function buildEmail() {

/* The proposal as a list of blocks, rendered once to the page and once to plain text. */
function proposalBlocks() {
  const tokens = shareTokens();
  const s = sizing();
  const P = C.proposal;
  const f = (str) => fill(str, tokens);
  const withNote = (value, note) => (value == null ? C.models.notListed : note ? value + " (" + note + ")" : value);
  const blocks = [
    { type: "title", text: f(P.title) },
    { type: "meta", lines: [f(P.subtitle), f(P.preparedFor), tokens.date, f(P.preparedBy)] },
    { type: "heading", text: P.summaryHeading },
    { type: "para", text: f(P.summary) },
    { type: "heading", text: P.commercialsHeading },
    { type: "table", rows: [
      [P.commercials.spend, s.spend], [P.commercials.seats, s.seatsUpTo], [P.commercials.quota, s.quotaTotal],
      [P.commercials.multiple, s.multiple], [P.commercials.saving, s.saving]
    ] },
    { type: "small", text: C.disclaimer },
    { type: "heading", text: P.scheduleHeading },
    { type: "table", head: [C.calculator.tableQuarter, C.calculator.legendPay, C.calculator.legendQuota],
      rows: s.quarters.map((q) => [q.name, q.pay, q.quota]) },
    { type: "heading", text: P.includesHeading },
    { type: "list", items: C.offer.includes.map(f) },
    { type: "heading", text: P.editionsHeading },
    { type: "table", head: C.offer.editionsHead.map(f), rows: editionRows().map((row) => row.cells) },
    { type: "small", text: f(C.offer.editionsCaption) },
    { type: "heading", text: P.pooledHeading },
    { type: "para", text: f(C.pool.lede) },
    { type: "heading", text: P.howHeading },
    { type: "list", ordered: true, items: C.how.nodes.map((node) => f(node.title) + ": " + f(node.text)) },
    { type: "para", text: f(C.how.note) },
    { type: "heading", text: P.setupHeading },
    { type: "list", ordered: true, items: C.how.setup.map(f) },
    { type: "heading", text: P.billingHeading },
    { type: "table", head: C.how.billingHead,
      rows: C.how.billing.map((row) => [f(row.route), f(row.signin), f(row.models), (C.how.billingKinds[row.kind] || "") + ". " + f(row.billed)]) },
    { type: "heading", text: P.tasksHeading },
    { type: "para", text: [C.tasks.split.exec, C.tasks.split.plan].map((x) => f(x.label) + ": " + f(x.share).toLowerCase()).join(". ") + "." }
  ];
  C.tasks.columns.forEach((col) => {
    blocks.push({ type: "para", text: f(col.title) });
    blocks.push({ type: "list", items: col.items.map((item) => f(item.task) + ". " + f(item.why)) });
  });
  blocks.push(
    { type: "heading", text: P.compareHeading },
    { type: "table", head: [C.compare.rowHeader].concat(C.compare.columns.map(f)),
      rows: C.compare.rows.map((row) => [f(row.label)].concat(row.cells.map(f))) },
    { type: "small", text: f(C.compare.source) },
    { type: "heading", text: P.modelsHeading },
    { type: "table", head: [C.models.measure].concat(modelNames(), [P.sourceHeading]),
      rows: comparisonRows().map((row) => [row.labelSub ? row.label + " (" + row.labelSub + ")" : row.label]
        .concat(row.cells.map((c) => withNote(c.value, c.note)), [row.source || ""])) },
    { type: "para", text: f(C.models.paragraph) },
    { type: "heading", text: f(P.pilotHeading) },
    { type: "list", items: C.pilot.steps.map((step) => f(step.when) + ": " + f(step.text)) },
    { type: "heading", text: P.termsHeading },
    { type: "list", items: C.offer.terms.map(f).concat(P.extraTerms.map(f)) },
    { type: "small", text: f(C.footer.footnotes) },
    { type: "small", text: C.disclaimer }
  );
  if (CONFIG.draft) blocks.push({ type: "small", text: C.banner });
  return blocks;
}

function proposalNode(blocks) {
  const doc = el("div");
  blocks.forEach((b) => {
    if (b.type === "title") doc.appendChild(el("h3", { class: "proposal-title", text: b.text }));
    else if (b.type === "meta") doc.appendChild(el("p", { class: "proposal-meta" }, b.lines.map((line) => el("span", { text: line }))));
    else if (b.type === "heading") doc.appendChild(el("h4", { text: b.text }));
    else if (b.type === "para") doc.appendChild(el("p", { text: b.text }));
    else if (b.type === "small") doc.appendChild(el("p", { class: "proposal-small", text: b.text }));
    else if (b.type === "list") doc.appendChild(el(b.ordered ? "ol" : "ul", null, b.items.map((item) => el("li", { text: item }))));
    else if (b.type === "table") {
      const table = el("table");
      if (b.head) table.appendChild(el("thead", null, el("tr", null, b.head.map((h) => el("th", { scope: "col", text: h })))));
      table.appendChild(el("tbody", null, b.rows.map((row) => el("tr", null,
        row.map((value, i) => (i === 0 ? el("th", { scope: "row", text: value }) : el("td", { text: value })))))));
      doc.appendChild(el("div", { class: "table-scroll" }, table));
    }
  });
  return doc;
}

function proposalText(blocks) {
  const out = [];
  blocks.forEach((b) => {
    if (b.type === "title") out.push(b.text, "");
    else if (b.type === "meta") out.push(b.lines.join("\n"), "");
    else if (b.type === "heading") out.push(b.text.toUpperCase());
    else if (b.type === "para" || b.type === "small") out.push(b.text, "");
    else if (b.type === "list") out.push(b.items.map((item, i) => (b.ordered ? (i + 1) + ". " : "- ") + item).join("\n"), "");
    else if (b.type === "table") {
      const lines = b.head
        ? b.rows.map((row) => [row[0]].concat(row.slice(1).map((value, i) => (value ? b.head[i + 1] + ": " + value : "")).filter(Boolean)).join(" | "))
        : b.rows.map((row) => row.join(": "));
      out.push(lines.join("\n"), "");
    }
  });
  return out.join("\n").trim() + "\n";
}

function buildShare() {
  const S = C.share;
  const emailPanel = $("email-panel"), proposalPanel = $("proposal-panel");
  const subject = $("email-subject"), body = $("email-body"), mail = $("email-open"), doc = $("proposal-doc");
  const status = $("share-status");
  let proposalPlain = "";

  const refresh = () => {
    if (!emailPanel.hidden) {
      const e = buildEmail();
      subject.value = e.subject;
      body.value = e.body;
      body.rows = e.body.split("\n").length + 1;
      mail.setAttribute("href", "mailto:?subject=" + encodeURIComponent(e.subject) + "&body=" + encodeURIComponent(e.body));
    }
    if (!proposalPanel.hidden) {
      const blocks = proposalBlocks();
      doc.textContent = "";
      doc.appendChild(proposalNode(blocks));
      proposalPlain = proposalText(blocks);
    }
  };
  calc.listeners.push(refresh);
  $("share-company").addEventListener("input", refresh);
  $("share-contact").addEventListener("input", refresh);

  const wire = (button, panel) => {
    button.addEventListener("click", () => {
      const open = panel.hidden;
      panel.hidden = !open;
      button.setAttribute("aria-expanded", String(open));
      status.textContent = "";
      refresh();
    });
  };
  wire($("email-toggle"), emailPanel);
  wire($("proposal-toggle"), proposalPanel);

  const say = (message) => { status.textContent = ""; setTimeout(() => { status.textContent = message; }, 30); };
  const copy = (text, selectTarget) => {
    const fallback = () => {
      // Select the text so the reader can copy it by hand, and try the older copy command.
      let ok = false;
      try {
        if (selectTarget && selectTarget.select) { selectTarget.focus(); selectTarget.select(); }
        else if (selectTarget) { const r = document.createRange(); r.selectNodeContents(selectTarget); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
        ok = document.execCommand && document.execCommand("copy");
      } catch (e) { ok = false; }
      say(ok ? S.copied : S.copyFailed);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => say(S.copied), fallback);
    } else fallback();
  };
  $("email-copy").addEventListener("click", () => copy(subject.value + "\n\n" + body.value, body));
  $("proposal-copy").addEventListener("click", () => copy(proposalPlain, doc));

  const printButton = $("proposal-print");
  if (CONFIG.features && CONFIG.features.print && typeof window.print === "function") {
    printButton.addEventListener("click", () => {
      const root = $("print-root");
      root.textContent = "";
      root.appendChild(proposalNode(proposalBlocks()));
      document.documentElement.classList.add("print-proposal");
      const done = () => { document.documentElement.classList.remove("print-proposal"); root.textContent = ""; window.removeEventListener("afterprint", done); };
      window.addEventListener("afterprint", done);
      window.print();
    });
  } else {
    printButton.hidden = true;
  }
}

------------------------------------------------------------------- */
function wireChrome() {
  const bar = $("review-bar");
  if (!CONFIG.draft) bar.hidden = true;
  $("review-dismiss").addEventListener("click", () => { bar.hidden = true; });

  const toggle = $("menu-toggle"), nav = $("site-nav");
  const setOpen = (open) => { nav.classList.toggle("open", open); toggle.setAttribute("aria-expanded", String(open)); };
  toggle.addEventListener("click", () => setOpen(!nav.classList.contains("open")));
  nav.addEventListener("click", (e) => { if (e.target.closest("a")) setOpen(false); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && nav.classList.contains("open")) { setOpen(false); toggle.focus(); }
  });
}

function wireReveal() {
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !("IntersectionObserver" in window)) return;
  document.documentElement.classList.add("js-reveal");
  const io = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) { entry.target.classList.add("in"); io.unobserve(entry.target); }
    });
  }, { threshold: 0, rootMargin: "0px 0px -4% 0px" });
  document.querySelectorAll(".reveal").forEach((node) => io.observe(node));
}

    if (target) { const holder = target.closest("details"); if (holder) holder.open = true; target.scrollIntoView(); }
  }
  window.addEventListener("hashchange", () => {
    const target = location.hash.length > 1 ? document.getElementById(decodeURIComponent(location.hash.slice(1))) : null;
    const holder = target && target.closest("details");
    if (holder && !holder.open) { holder.open = true; target.scrollIntoView(); }
  });
}
